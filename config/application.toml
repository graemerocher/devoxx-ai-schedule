[micronaut.application]
name = "dvxaisched"

[micronaut.server]
port = "${PORT:8080}"
host = "0.0.0.0"

[micronaut.router.static-resources.default]
enabled = true
paths = ["classpath:public"]
mapping = "/**"

# Async routes are served from per-event-loop copies of Python beans when the
# GraalPy context pool is enabled; that currently drops Java constructor
# arguments and duplicates singleton state (rate limiter, cache), so the
# application runs in a single shared context.
[micronaut.python.pool]
enabled = false

[micronaut.http.client]
read-timeout = "120s"
connect-timeout = "30s"

# ------------------------------------------------------------------------------
# LLM backend selection
# ------------------------------------------------------------------------------
# The agents talk to an `LlmClient` abstraction. Pick the implementation with
# `llm.provider` (env: LLM_PROVIDER):
#   gemini  - Google Gemini via the Generative Language REST API (default)
#   openai  - any OpenAI-compatible Chat Completions API (OpenAI, Ollama, vLLM, ...)
[llm]
provider = "gemini"

[llm.gemini]
api-key = "${GEMINI_API_KEY:}"
model = "gemini-3.5-flash-lite"
base-url = "https://generativelanguage.googleapis.com"
temperature = 0.2

[llm.openai]
api-key = "${OPENAI_API_KEY:}"
# model = "..."  (required when llm.provider = "openai"; env: LLM_OPENAI_MODEL)
base-url = "${OPENAI_BASE_URL:https://api.openai.com/v1}"
temperature = 0.2

# ------------------------------------------------------------------------------
# IP & session rate limiting
# ------------------------------------------------------------------------------
[ratelimit]
enabled = true
session-limit = 5
session-window-seconds = 60
ip-limit = 60
ip-window-seconds = 60

# In-memory query schedule cache (avoids repeated LLM calls for common prompts)
[cache.schedule]
enabled = true
ttl-minutes = 120
max-entries = 500
