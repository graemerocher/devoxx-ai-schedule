[micronaut.application]
name = "dvxaisched"

[micronaut.server]
port = "${PORT:8080}"
host = "0.0.0.0"

[micronaut.router.static-resources.default]
enabled = true
paths = ["classpath:public"]
mapping = "/**"

# GraalPy context pool: route modules are pooled (one instance per context), and
# so are the services they reach on every request (DevoxxConferenceService,
# RateLimiterService), whose shared state lives in Java (Caffeine caches, a
# Semaphore bean). Singletons the pooled types may keep depending on:
# - DevoxxAgentWorkflowService: schedules are cached (ScheduleCache, itself
#   pooled) and generating one is spent waiting for Gemini, so pooling the
#   workflow would gain little;
# - RateLimitConfig: configuration, read once when a RateLimiterService is created.
#
# The pool is enabled for the test suite (tests-config/application-test.toml)
# but not yet here: under `pyronaut run`, async routes are served from
# per-event-loop copies of Python objects, and Pyronaut 0.0.10 re-creates some of
# them without their constructor arguments (e.g. SchemaAwareChatModel). Set
# `enabled = true` once that is fixed.
[micronaut.python.pool]
enabled = false
ignoreDependencies = ["DevoxxAgentWorkflowService", "RateLimitConfig"]

[micronaut.http.client]
read-timeout = "120s"
connect-timeout = "30s"

# ------------------------------------------------------------------------------
# LangChain4j
# ------------------------------------------------------------------------------
# JSON schemas of the agents' structured outputs are generated at compile time
# by Micronaut JSON Schema (`@JsonSchema`) and sent to the chat model.
# Strict mode marks every non-nullable property as required.
[micronaut.jsonschema]
strictMode = true

# The agents are stateless: do not attach the default in-memory chat memory
# (the parallel mapper rejects sub-agents that have chat memory).
[langchain4j.chat-memory-store.inmemory]
enabled = false

# Chat model used by every agent. To use another provider, add its module
# (e.g. micronaut-langchain4j-openai) to pyproject.toml, configure it under its
# own prefix (e.g. [langchain4j.open-ai]) and set `enabled = false` here.
[langchain4j.google-ai-gemini]
enabled = true
api-key = "${GEMINI_API_KEY:}"
model-name = "gemini-3.5-flash-lite"

[langchain4j.google-ai-gemini.chat-model]
temperature = 0.2
timeout = "120s"

# ------------------------------------------------------------------------------
# IP & session rate limiting
# ------------------------------------------------------------------------------
[ratelimit]
enabled = true
session-limit = 5
session-window-seconds = 60
ip-limit = 60
ip-window-seconds = 60

# Cache of synthesized schedules keyed by normalized interests (avoids
# repeated Gemini calls for common prompts). See dvxaisched.cache.
[micronaut.caches.schedules]
expire-after-write = "120m"
maximum-size = 500

# Sliding rate-limit windows shared by every pooled RateLimiterService; idle
# windows expire (they are at most `*-window-seconds` long).
[micronaut.caches.ratelimit-sessions]
expire-after-access = "5m"
maximum-size = 100000

[micronaut.caches.ratelimit-ips]
expire-after-access = "5m"
maximum-size = 100000
