[micronaut.application]
name = "dvxaisched"

[micronaut.server]
port = "${PORT:8080}"
host = "0.0.0.0"

[micronaut.router.static-resources.default]
enabled = true
paths = ["classpath:public"]
mapping = "/**"

# Async routes are served from per-event-loop copies of Python beans when the
# GraalPy context pool is enabled; that currently drops Java constructor
# arguments and duplicates singleton state (rate limiter, cache), so the
# application runs in a single shared context (as the Micronaut LangChain4j
# Python test suite does).
[micronaut.python.pool]
enabled = false

[micronaut.http.client]
read-timeout = "120s"
connect-timeout = "30s"

# ------------------------------------------------------------------------------
# LangChain4j
# ------------------------------------------------------------------------------
# JSON schemas of the agents' structured outputs are generated at compile time
# by Micronaut JSON Schema (`@JsonSchema`) and sent to the chat model.
# Strict mode marks every non-nullable property as required.
[micronaut.jsonschema]
strictMode = true

# The agents are stateless: do not attach the default in-memory chat memory
# (the parallel mapper rejects sub-agents that have chat memory).
[langchain4j.chat-memory-store.inmemory]
enabled = false

# Chat model used by every agent. To use another provider, add its module
# (e.g. micronaut-langchain4j-openai) to pyproject.toml, configure it under its
# own prefix (e.g. [langchain4j.open-ai]) and set `enabled = false` here.
[langchain4j.google-ai-gemini]
enabled = true
api-key = "${GEMINI_API_KEY:}"
model-name = "gemini-3.5-flash-lite"

[langchain4j.google-ai-gemini.chat-model]
temperature = 0.2
timeout = "120s"

# ------------------------------------------------------------------------------
# IP & session rate limiting
# ------------------------------------------------------------------------------
[ratelimit]
enabled = true
session-limit = 5
session-window-seconds = 60
ip-limit = 60
ip-window-seconds = 60

# In-memory query schedule cache (avoids repeated Gemini calls for common prompts)
[cache.schedule]
enabled = true
ttl-minutes = 120
max-entries = 500
