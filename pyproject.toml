[project]
name = "dvxaisched"
version = "0.1.0"
description = "Devoxx Belgium 2026 AI Schedule Curator built with Pyronaut"
dynamic = ["scripts"]

[build-system]
requires = ["setuptools", "wheel", "tomli"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyronaut]
repositories = ["mavenCentral"]

[tool.pyronaut.toolchain]
type = "jvm"

[tool.pyronaut.sources]
python = "src"
python-test = "tests"
resources = "config"
additional-resources = ["assets"]
test-resources = "tests-config"

[tool.pyronaut.processor]
# Optimistic incremental processing occasionally left stale VFS entries during
# development of this port, so full (cached) processing is used instead.
incremental = false
daemon = false

[tool.pyronaut.test]
engine = "pytest"

[tool.pyronaut.ide-stubs]
packages = ["io.micronaut", "jakarta", "reactor.core.publisher"]

[tool.pyronaut.validation]
enabled = true
# `micronaut.jsonschema.*` (application.toml) are annotation processor
# options, not runtime properties, so the runtime configuration schema rejects them.
suppressions = ["micronaut.jsonschema"]

[tool.pyronaut.dependencies]
runtime = [
  "io.micronaut.pyronaut:micronaut-pyronaut-logback",
  "io.micronaut.serde:micronaut-serde-jackson",
  "io.micronaut:micronaut-http-server-netty",
  "io.micronaut:micronaut-http-client",
  # Netty-backed asyncio event loop. The `pyronaut dev`/`run` launchers bundle
  # it, but `pyronaut test` and packaged builds otherwise fall back to a loop
  # that cannot await Netty HTTP client calls or use run_in_executor.
  "io.micronaut:micronaut-context-python-netty",
  "io.micronaut.reactor:micronaut-reactor",
  # LangChain4j AI services and agentic workflows
  "io.micronaut.langchain4j:micronaut-langchain4j-core",
  "io.micronaut.langchain4j:micronaut-langchain4j-agentic",
  # Chat model provider: Gemini by default. Swap (or add) another provider
  # module such as micronaut-langchain4j-openai or -ollama to change backend.
  "io.micronaut.langchain4j:micronaut-langchain4j-googleai-gemini",
  # Compile-time JSON schemas of the agents' structured outputs
  "io.micronaut.jsonschema:micronaut-json-schema-annotations",
  "io.micronaut.jsonschema:micronaut-json-schema-utils",
]
build = [
  "io.micronaut.serde:micronaut-serde-processor",
  "io.micronaut:micronaut-http-validation",
  "io.micronaut.langchain4j:micronaut-langchain4j-processor",
  "io.micronaut.jsonschema:micronaut-json-schema-processor",
]
test = [
  "io.micronaut.pyronaut:micronaut-pyronaut-pytest",
  "io.micronaut.pyronaut:micronaut-pyronaut-requests",
]
